<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#6f9a84">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>میرا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --line:#e7dfcf; --text:#1f2a44; --sub:#6b7488;
  --green:#6f9a84; --green-d:#4f7d68; --blue:#dbe8f2; --navy:#1f2a44; --warn:#b4513d; --warn-bg:#fbeae5;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a2b; --card:#1b2640; --line:#2c3a5c; --text:#eef1f8; --sub:#9aa5c0;
    --green:#7fb299; --green-d:#a5d0bb; --blue:#27395a; --navy:#eef1f8; --warn:#f0a090; --warn-bg:#3a2326; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a2b; --card:#1b2640; --line:#2c3a5c; --text:#eef1f8; --sub:#9aa5c0;
  --green:#7fb299; --green-d:#a5d0bb; --blue:#27395a; --navy:#eef1f8; --warn:#f0a090; --warn-bg:#3a2326; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.8}
.app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.1rem;margin:0 0 8px}
.sub{color:var(--sub);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.btn{font:inherit;border:0;border-radius:14px;padding:10px 18px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.warn{background:var(--warn-bg);color:var(--warn)}
.btn.sm{padding:4px 12px;font-size:.85rem}
.faces,.chips,.row{display:flex;gap:8px;flex-wrap:wrap}
.faces button{flex:1;min-width:52px;font-size:1.9rem;padding:8px 0;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.faces button.on{border-color:var(--green);background:var(--blue)}
.chip{font:inherit;font-size:.9rem;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.9rem;color:var(--sub);margin:10px 0 4px}
.half{flex:1;min-width:130px}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.7rem;color:var(--sub)}
.bar i{display:block;width:100%;border-radius:8px;background:var(--green);min-height:4px}
.bar i.none{background:var(--line)}
.item{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.item:first-child{border-top:0}
.big{font-size:1.8rem}
.note{background:var(--blue);border-radius:14px;padding:10px 14px;font-size:.9rem}
.safe{background:var(--warn-bg);border:1px solid var(--warn);border-radius:20px;padding:16px;margin-bottom:14px}
.circle{width:150px;height:150px;border-radius:50%;background:var(--green);margin:24px auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;transition:transform 4s ease-in-out}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:100px;font:inherit;font-size:.72rem;background:none;border:0;color:var(--sub);cursor:pointer;padding:4px 0}
nav button span{display:block;font-size:1.3rem;line-height:1.3}
nav button.on{color:var(--green-d);font-weight:700}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:.9rem;z-index:5}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.circle{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><h1>میرا</h1><button class="btn warn sm" data-tab="help">کمک فوری</button></header>
  <main id="view"></main>
</div>
<nav id="nav">
  <button data-tab="home"><span>🏠</span>خانه</button>
  <button data-tab="mood"><span>🙂</span>حال من</button>
  <button data-tab="sleep"><span>🌙</span>خواب</button>
  <button data-tab="notes"><span>📝</span>یادداشت</button>
  <button data-tab="relax"><span>🌿</span>آرامش</button>
</nav>
<script>
(function(){
  var S={mood:[],sleep:[],notes:[]}, tab="home", selM=null, selE=[], selQ=3, q="", bOn=false, bt=null;
  var MOODS=[["😞","خیلی بد"],["😕","بد"],["😐","معمولی"],["🙂","خوب"],["😄","عالی"]];
  var EMO=["آرام","امیدوار","مضطرب","غمگین","عصبانی","خسته","سپاسگزار","تنها","باانگیزه","کلافه"];
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function fa(n){return Number(n).toLocaleString("fa-IR");}
  function dt(t){try{return new Date(t).toLocaleString("fa-IR",{dateStyle:"medium",timeStyle:"short"});}catch(e){return new Date(t).toLocaleString();}}
  function load(){try{var r=localStorage.getItem("mira1");if(r){var d=JSON.parse(r);S.mood=d.mood||[];S.sleep=d.sleep||[];S.notes=d.notes||[];}}catch(e){}}
  function save(){try{localStorage.setItem("mira1",JSON.stringify(S));}catch(e){}}
  function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove();},2400);}
  function hm(min){var h=Math.floor(min/60),m=min%60;return fa(h)+" ساعت"+(m?" و "+fa(m)+" دقیقه":"");}
  function days7(){var a=[],n=new Date();for(var i=6;i>=0;i--){var d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i);a.push(d);}return a;}
  function sameDay(t,d){return new Date(t).toDateString()===d.toDateString();}
  function inWeek(t){return t>=Date.now()-7*864e5;}

  function stopBreath(){bOn=false;clearTimeout(bt);}
  function startBreath(){
    stopBreath();bOn=true;var c=$("bc"),l=$("bl"),cnt=$("bn");
    var P=[["دم بگیر",4,1.35],["نگه دار",4,1.35],["آهسته بازدم",6,1]];
    (function step(i){
      if(!bOn||!c)return;var p=P[i%3];
      l.textContent=p[0];c.style.transitionDuration=reduce?"0s":p[1]+"s";c.style.transform="scale("+p[2]+")";
      if(i%3===0)cnt.textContent="دور "+fa(i/3+1);
      bt=setTimeout(function(){step(i+1);},p[1]*1000);
    })(0);
  }

  var views={
    home:function(){
      var t=new Date(),todayM=S.mood.filter(function(m){return sameDay(m.t,t);}),last=todayM[todayM.length-1];
      var sl=S.sleep[S.sleep.length-1];
      var wm=S.mood.filter(function(m){return inWeek(m.t);}),ws=S.sleep.filter(function(s){return inWeek(s.t);});
      var h="<div class='card'><h2>سلام 🌿</h2><p class='sub'>میرا کمک می‌کنه حال و خوابت رو بهتر بشناسی. اینجا هیچ چیزی اجباری نیست.</p></div>";
      h+="<div class='card'><h2>حال امروز</h2>"+(last?"<div class='big'>"+MOODS[last.m][0]+" <span class='sub' style='font-size:1rem'>"+MOODS[last.m][1]+"</span></div>":"<p class='sub'>امروز هنوز حالت رو ثبت نکردی.</p>")+"<button class='btn' data-tab='mood'>ثبت حال</button></div>";
      h+="<div class='card'><h2>آخرین خواب</h2>"+(sl?"<p>"+hm(sl.min)+"، کیفیت "+fa(sl.q)+" از "+fa(5)+"</p>":"<p class='sub'>هنوز خوابی ثبت نشده.</p>")+"<button class='btn ghost' data-tab='sleep'>ثبت خواب</button></div>";
      h+="<div class='card'><h2>این هفته</h2>";
      if(wm.length>=3||ws.length>=3){
        if(wm.length>=3){var a=wm.reduce(function(x,m){return x+m.m;},0)/wm.length;h+="<p>میانگین حال: "+MOODS[Math.round(a)][0]+" ("+fa(wm.length)+" ثبت)</p>";}
        if(ws.length>=3){var b=Math.round(ws.reduce(function(x,s){return x+s.min;},0)/ws.length);h+="<p>میانگین خواب: "+hm(b)+" ("+fa(ws.length)+" شب)</p>";}
        h+="<p class='sub'>این‌ها فقط میانگین داده‌های خودته، نه تشخیص.</p>";
      } else h+="<p class='sub'>برای دیدن روند، حداقل ۳ ثبت لازمه. تا اون موقع چیزی نشون نمی‌دیم.</p>";
      h+="</div><div class='note'>میرا جایگزین روانشناس یا روانپزشک نیست و تشخیص نمی‌ده. اگه حالت خیلی بده، از یه متخصص کمک بگیر.</div>";
      h+="<div class='card' style='margin-top:14px'><h2>حریم خصوصی</h2><p class='sub'>همه‌چیز فقط روی همین دستگاه ذخیره می‌شه و جایی فرستاده نمی‌شه.</p><div class='row'><button class='btn ghost sm' data-act='export'>نمایش داده‌ها برای کپی</button><button class='btn warn sm' data-act='wipe'>حذف همه‌ی داده‌ها</button></div><div id='ex'></div></div>";
      return h;
    },
    mood:function(){
      var h="<div class='card'><h2>الان حالت چطوره؟</h2><div class='faces'>"+MOODS.map(function(m,i){return "<button data-m='"+i+"' class='"+(selM===i?"on":"")+"' aria-label='"+m[1]+"'>"+m[0]+"</button>";}).join("")+"</div>";
      h+="<label>احساس‌ها (اختیاری)</label><div class='chips'>"+EMO.map(function(e){return "<button class='chip"+(selE.indexOf(e)>-1?" on":"")+"' data-e='"+e+"'>"+e+"</button>";}).join("")+"</div>";
      h+="<label for='mnote'>یادداشت کوتاه (اختیاری)</label><input id='mnote' maxlength='300'><p></p><button class='btn' data-act='saveMood'>ذخیره</button></div>";
      h+="<div class='card'><h2>هفت روز اخیر</h2><div class='bars'>"+days7().map(function(d){
        var e=S.mood.filter(function(m){return sameDay(m.t,d);});
        var lab=d.toLocaleDateString("fa-IR",{weekday:"narrow"});
        if(!e.length)return "<div class='bar'><i class='none' style='height:4px'></i>"+lab+"</div>";
        var a=e.reduce(function(x,m){return x+m.m;},0)/e.length;
        return "<div class='bar'><i style='height:"+(20+a*16)+"%'></i>"+lab+"</div>";}).join("")+"</div></div>";
      h+="<div class='card'><h2>ثبت‌های قبلی</h2>"+(S.mood.length?S.mood.slice().reverse().slice(0,30).map(function(m){
        return "<div class='item'><div><span class='big'>"+MOODS[m.m][0]+"</span> "+(m.emo.length?esc(m.emo.join("، ")):"")+(m.note?"<div>"+esc(m.note)+"</div>":"")+"<div class='sub'>"+dt(m.t)+"</div></div><button class='btn ghost sm' data-del='mood:"+m.id+"'>حذف</button></div>";}).join(""):"<p class='sub'>هنوز چیزی ثبت نشده.</p>")+"</div>";
      return h;
    },
    sleep:function(){
      var h="<div class='card'><h2>خواب دیشب</h2><div class='row'><div class='half'><label for='bed'>ساعت خواب</label><input id='bed' type='time' value='23:00'></div><div class='half'><label for='wake'>ساعت بیدار شدن</label><input id='wake' type='time' value='07:00'></div></div>";
      h+="<label>کیفیت خواب</label><div class='chips'>"+[1,2,3,4,5].map(function(n){return "<button class='chip"+(selQ===n?" on":"")+"' data-q='"+n+"'>"+fa(n)+"</button>";}).join("")+"</div>";
      h+="<label for='aw'>تعداد بیدار شدن در شب</label><input id='aw' type='number' min='0' max='20' value='0'><label for='snote'>یادداشت (اختیاری)</label><input id='snote' maxlength='300'><p></p><button class='btn' data-act='saveSleep'>ذخیره</button></div>";
      h+="<div class='card'><h2>سابقه‌ی خواب</h2>"+(S.sleep.length?S.sleep.slice().reverse().slice(0,30).map(function(s){
        return "<div class='item'><div>"+hm(s.min)+" · کیفیت "+fa(s.q)+(s.aw?" · "+fa(s.aw)+" بار بیدار شدن":"")+(s.note?"<div>"+esc(s.note)+"</div>":"")+"<div class='sub'>"+dt(s.t)+"</div></div><button class='btn ghost sm' data-del='sleep:"+s.id+"'>حذف</button></div>";}).join(""):"<p class='sub'>هنوز خوابی ثبت نشده.</p>")+"<p class='sub'>مدت خواب بر اساس ساعت‌هایی که وارد می‌کنی محاسبه می‌شه و تخمینیه، نه ابزار پزشکی.</p></div>";
      return h;
    },
    notes:function(){
      var list=S.notes.slice().reverse().filter(function(n){return !q||(n.title+" "+n.text).indexOf(q)>-1;});
      var h="<div class='card'><h2>یادداشت جدید</h2><label for='nt'>عنوان (اختیاری)</label><input id='nt' maxlength='80'><label for='nx'>چی تو ذهنته؟</label><textarea id='nx' placeholder='مثلاً: امروز چه احساسی داشتم؟ چه چیزی خوب پیش رفت؟'></textarea><p></p><button class='btn' data-act='saveNote'>ذخیره</button></div>";
      h+="<div class='card'><h2>یادداشت‌های من</h2><input id='nq' placeholder='جست‌وجو' value='"+esc(q)+"'><div id='nl'>"+noteList(list)+"</div></div>";
      return h;
    },
    relax:function(){
      return "<div class='card' style='text-align:center'><h2>تمرین تنفس</h2><p class='sub'>۴ ثانیه دم، ۴ ثانیه نگه داشتن، ۶ ثانیه بازدم. اگه سرگیجه گرفتی، متوقف کن و عادی نفس بکش.</p><div class='circle' id='bc'><span id='bl'>آماده‌ای؟</span></div><div class='sub' id='bn'></div><p></p><button class='btn' data-act='bstart'>شروع</button> <button class='btn ghost' data-act='bstop'>توقف</button></div>"+
      "<div class='card'><h2>تمرین زمین‌گیری ۵-۴-۳-۲-۱</h2><p>۵ چیز که می‌بینی، ۴ چیز که لمس می‌کنی، ۳ صدایی که می‌شنوی، ۲ بویی که حس می‌کنی و ۱ مزه‌ای که می‌چشی رو یکی‌یکی نام ببر.</p></div>";
    },
    help:function(){
      return "<div class='safe'><h2>اگه در خطری</h2><p>اگه فکر آسیب زدن به خودت یا دیگری داری یا همین الان در خطری، فوراً با اورژانس کشورت تماس بگیر (در ایران: ۱۱۵) یا به یه نفر مورد اعتماد بگو که کنارت بمونه.</p><p>تنها نیستی و کمک گرفتن نشونه‌ی ضعف نیست.</p></div>"+
      "<div class='card'><h2>درباره‌ی میرا</h2><p>میرا ابزار خودشناسی و ثبت حال و خوابه. جایگزین روانشناس، روانپزشک یا اورژانس نیست و هیچ تشخیصی نمی‌ده.</p></div>";
    }
  };
  function noteList(list){
    return list.length?list.slice(0,50).map(function(n){return "<div class='item'><div><b>"+esc(n.title||"بدون عنوان")+"</b><div style='white-space:pre-wrap'>"+esc(n.text)+"</div><div class='sub'>"+dt(n.t)+"</div></div><button class='btn ghost sm' data-del='notes:"+n.id+"'>حذف</button></div>";}).join(""):"<p class='sub'>"+(q?"موردی پیدا نشد.":"هنوز یادداشتی نداری.")+"</p>";
  }
  function render(){
    stopBreath();
    $("view").innerHTML=views[tab]();
    [].forEach.call($("nav").children,function(b){b.className=b.getAttribute("data-tab")===tab?"on":"";});
    var nq=$("nq");if(nq)nq.addEventListener("input",function(){q=nq.value.trim();$("nl").innerHTML=noteList(S.notes.slice().reverse().filter(function(n){return !q||(n.title+" "+n.text).indexOf(q)>-1;}));});
    window.scrollTo(0,0);
  }
  function mins(a,b){var x=a.split(":"),y=b.split(":");return ((+y[0]*60+ +y[1])-(+x[0]*60+ +x[1])+1440)%1440;}

  document.addEventListener("click",function(e){
    var el=e.target.closest("button");if(!el)return;
    var d;
    if((d=el.getAttribute("data-tab"))){tab=d;render();return;}
    if((d=el.getAttribute("data-m"))!==null){selM=+d;[].forEach.call(el.parentNode.children,function(b){b.classList.toggle("on",b===el);});return;}
    if((d=el.getAttribute("data-e"))){var i=selE.indexOf(d);if(i>-1)selE.splice(i,1);else selE.push(d);el.classList.toggle("on");return;}
    if((d=el.getAttribute("data-q"))){selQ=+d;[].forEach.call(el.parentNode.children,function(b){b.classList.toggle("on",b===el);});return;}
    if((d=el.getAttribute("data-del"))){
      if(!confirm("این مورد برای همیشه حذف شود؟"))return;
      var p=d.split(":");S[p[0]]=S[p[0]].filter(function(x){return String(x.id)!==p[1];});save();render();toast("حذف شد");return;
    }
    d=el.getAttribute("data-act");if(!d)return;
    if(d==="saveMood"){
      if(selM===null){toast("اول یکی از حالت‌ها رو انتخاب کن");return;}
      S.mood.push({id:Date.now(),m:selM,emo:selE.slice(),note:$("mnote").value.trim(),t:Date.now()});
      save();selM=null;selE=[];render();toast("ثبت شد");
    } else if(d==="saveSleep"){
      var m=mins($("bed").value,$("wake").value);
      if(!$("bed").value||!$("wake").value){toast("ساعت‌ها رو وارد کن");return;}
      if(m===0){toast("ساعت خواب و بیداری نباید یکی باشه");return;}
      if(m>20*60){toast("بیش از ۲۰ ساعت؟ ساعت‌ها رو بررسی کن");return;}
      var aw=Math.max(0,Math.min(20,parseInt($("aw").value,10)||0));
      S.sleep.push({id:Date.now(),min:m,q:selQ,aw:aw,note:$("snote").value.trim(),t:Date.now()});
      save();render();toast("ثبت شد");
    } else if(d==="saveNote"){
      var tx=$("nx").value.trim();if(!tx){toast("چیزی بنویس");return;}
      S.notes.push({id:Date.now(),title:$("nt").value.trim(),text:tx,t:Date.now()});
      save();q="";render();toast("ذخیره شد");
    } else if(d==="bstart"){startBreath();}
    else if(d==="bstop"){stopBreath();var l=$("bl"),c=$("bc");if(l){l.textContent="آماده‌ای؟";c.style.transitionDuration=reduce?"0s":"1s";c.style.transform="scale(1)";}}
    else if(d==="export"){$("ex").innerHTML="<p></p><textarea readonly id='exd'></textarea>";$("exd").value=JSON.stringify(S,null,2);$("exd").select();}
    else if(d==="wipe"){
      if(!confirm("همه‌ی ثبت‌ها و یادداشت‌ها برای همیشه حذف بشن؟"))return;
      S={mood:[],sleep:[],notes:[]};save();render();toast("همه‌ی داده‌ها حذف شد");
    }
  });
  load();render();
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
})();
</script>
</body>
</html>
